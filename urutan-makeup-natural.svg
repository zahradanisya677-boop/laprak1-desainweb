<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Arial, sans-serif">
  <rect width="900" height="420" fill="#fff8f5"/>
  <text x="450" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#6d3b3b">Urutan Makeup Natural</text>

  <!-- panah -->
  <g stroke="#d9a6a0" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M205 190 L235 190"/><path d="M425 190 L455 190"/><path d="M645 190 L675 190"/>
  </g>
  <g fill="#d9a6a0">
    <polygon points="235,182 249,190 235,198"/><polygon points="455,182 469,190 455,198"/><polygon points="675,182 689,190 675,198"/>
  </g>

  <!-- 1 Pelembap & tabir surya -->
  <circle cx="110" cy="80" r="18" fill="#e57373"/><text x="110" y="87" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">1</text>
  <rect x="70" y="120" width="80" height="130" rx="14" fill="#fff3c4" stroke="#e0b84c" stroke-width="3"/>
  <rect x="85" y="100" width="50" height="22" rx="5" fill="#e0b84c"/>
  <circle cx="110" cy="170" r="18" fill="#ffd54f"/>
  <g stroke="#ffd54f" stroke-width="3"><line x1="110" y1="140" x2="110" y2="146"/><line x1="110" y1="194" x2="110" y2="200"/><line x1="80" y1="170" x2="86" y2="170"/><line x1="134" y1="170" x2="140" y2="170"/></g>
  <text x="110" y="290" font-size="15" font-weight="bold" text-anchor="middle" fill="#6d3b3b">Pelembap &amp;</text>
  <text x="110" y="310" font-size="15" font-weight="bold" text-anchor="middle" fill="#6d3b3b">tabir surya</text>

  <!-- 2 Foundation -->
  <circle cx="330" cy="80" r="18" fill="#e57373"/><text x="330" y="87" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">2</text>
  <rect x="318" y="100" width="24" height="26" rx="4" fill="#5d4037"/>
  <rect x="300" y="126" width="60" height="124" rx="12" fill="#f3c9a0" stroke="#c79a6e" stroke-width="3"/>
  <rect x="312" y="165" width="36" height="50" rx="4" fill="#fff8f0" opacity="0.8"/>
  <text x="330" y="290" font-size="15" font-weight="bold" text-anchor="middle" fill="#6d3b3b">Foundation /</text>
  <text x="330" y="310" font-size="15" font-weight="bold" text-anchor="middle" fill="#6d3b3b">cushion</text>

  <!-- 3 Concealer -->
  <circle cx="550" cy="80" r="18" fill="#e57373"/><text x="550" y="87" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">3</text>
  <rect x="544" y="100" width="12" height="40" rx="4" fill="#d9b38c"/>
  <rect x="530" y="140" width="40" height="30" rx="5" fill="#8d6e63"/>
  <rect x="534" y="170" width="32" height="80" rx="6" fill="#f5d6b8" stroke="#c79a6e" stroke-width="3"/>
  <text x="550" y="290" font-size="15" font-weight="bold" text-anchor="middle" fill="#6d3b3b">Concealer</text>

  <!-- 4 Blush & lipstik -->
  <circle cx="770" cy="80" r="18" fill="#e57373"/><text x="770" y="87" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">4</text>
  <circle cx="740" cy="190" r="42" fill="#f2b5b0" stroke="#d98c86" stroke-width="3"/>
  <circle cx="740" cy="190" r="28" fill="#f48fb1"/>
  <path d="M810 120 L810 150 L830 150 L830 120 Q820 105 810 120Z" fill="#c2185b"/>
  <rect x="806" y="150" width="28" height="20" fill="#bdbdbd"/>
  <rect x="802" y="170" width="36" height="80" rx="5" fill="#8d6e63"/>
  <text x="770" y="290" font-size="15" font-weight="bold" text-anchor="middle" fill="#6d3b3b">Blush &amp; lipstik</text>
